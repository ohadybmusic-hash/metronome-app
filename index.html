<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d0b" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem('metronome.visualLayout')
          var layout = v === 'light' || v === 'synthwave' ? v : 'obsidian'
          document.documentElement.dataset.visualLayout = layout
          document.documentElement.dataset.theme = layout === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.visualLayout = 'obsidian'
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta name="description" content="BPM metronome, setlists, and tuner for practice" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Lock viewport scaling so the app always fits the screen -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter + Space Grotesk: self-hosted via @fontsource-variable in main.jsx. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <title>Metronome</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root">
      <div id="metronome-float-portal"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
